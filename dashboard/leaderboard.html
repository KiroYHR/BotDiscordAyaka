<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayaka Leaderboard - Bảng Xếp Hạng</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .leaderboard-container {
            max-width: 800px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .dark-mode .leaderboard-container {
            background: rgba(30, 30, 40, 0.9);
            color: white;
        }

        .lb-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .lb-header h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .lb-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .lb-row {
            background: rgba(240, 248, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .dark-mode .lb-row {
            background: rgba(50, 50, 60, 0.5);
        }

        .lb-row:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .lb-cell {
            padding: 1rem;
            vertical-align: middle;
        }

        .lb-row td:first-child {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            font-weight: bold;
            font-size: 1.5rem;
            text-align: center;
            width: 80px;
        }

        .lb-row td:last-child {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            text-align: right;
            font-weight: bold;
            color: var(--primary-color);
        }

        .rank-1 td:first-child { color: gold; }
        .rank-2 td:first-child { color: silver; }
        .rank-3 td:first-child { color: #cd7f32; } /* Bronze */

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
        }

        .user-name {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .user-tag {
            font-size: 0.8rem;
            color: gray;
        }
        
        .level-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-right: 10px;
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 1rem;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body class="light-mode">
    <div class="theme-switch" onclick="toggleTheme()">🌓 Đổi Giao Diện</div>

    <div class="leaderboard-container">
        <a href="/" class="back-btn">⬅ Quay lại Bảng điều khiển</a>
        
        <div class="lb-header">
            <h1>🏆 Bảng Phong Thần 🏆</h1>
            <p>Tôn vinh những người chăm chỉ tương tác nhất cùng Ayaka</p>
        </div>

        <table class="lb-table">
            <tbody id="lb-body">
                <tr>
                    <td colspan="4" style="text-align: center; padding: 2rem;">Đang tải dữ liệu...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
        }

        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const users = await response.json();
                const tbody = document.getElementById('lb-body');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Chưa có ai trong danh sách!</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                users.forEach(user => {
                    let rankClass = '';
                    if (user.rank === 1) rankClass = 'rank-1';
                    else if (user.rank === 2) rankClass = 'rank-2';
                    else if (user.rank === 3) rankClass = 'rank-3';

                    const row = document.createElement('tr');
                    row.className = `lb-row ${rankClass}`;
                    row.innerHTML = `
                        <td class="lb-cell">#${user.rank}</td>
                        <td class="lb-cell">
                            <div class="user-info">
                                <img src="${user.avatar}" alt="Avatar" class="user-avatar">
                                <div>
                                    <div class="user-name">${user.display_name}</div>
                                    <div class="user-tag">@${user.username}</div>
                                </div>
                            </div>
                        </td>
                        <td class="lb-cell">
                            <span class="level-badge">Lv. ${user.level}</span>
                        </td>
                        <td class="lb-cell">
                            ✨ ${user.exp.toLocaleString()} EXP
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('lb-body').innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Lỗi tải dữ liệu!</td></tr>';
            }
        }

        // Tải dữ liệu ngay khi mở trang
        fetchLeaderboard();
        
        // Tự động tải lại sau mỗi phút
        setInterval(fetchLeaderboard, 60000);
    </script>
</body>
</html>
